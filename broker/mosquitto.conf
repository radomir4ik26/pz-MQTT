# Eclipse Mosquitto MQTT Broker Configuration

# ── Listener ──────────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket listener (for browser / Postman MQTT-over-WS)
listener 9001
protocol websockets

# ── Security ──────────────────────────────────────────────
# Allow anonymous connections (for development/testing)
allow_anonymous true

# ── Logging ───────────────────────────────────────────────
log_type all
log_dest stdout

# ── Persistence ───────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Message limits ────────────────────────────────────────
max_queued_messages 1000
message_size_limit 0
